# Copy to ~/.config/cryon/config.yaml and adjust.
CRYON_PROVIDER: custom_kilo
CRYON_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free

# Keep secrets in ~/.config/cryon/secrets.yaml (mode 0600) instead of the OS
# keyring. Deterministic and headless-friendly, which is what an unattended
# long-running agent needs.
CRYON_DISABLE_KEYRING: true

CONTEXT_FILE_NAMES:
  - .cryonhints
  - AGENTS.md

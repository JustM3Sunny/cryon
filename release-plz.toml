[workspace]
release = false
pr_name = "chore(GDK): release{% if version %} v{{ version }}{% endif %}"
git_tag_enable = false
git_tag_name = "gdk-v{{ version }}"
git_release_enable = false

[[package]]
name = "cryon-provider-types"
release = true
version_group = "gdk"

[[package]]
name = "cryon-sdk-types"
release = true
version_group = "gdk"

[[package]]
name = "cryon-download-manager"
release = true
version_group = "gdk"

[[package]]
name = "cryon-local-inference"
release = true
version_group = "gdk"
# cargo-semver-checks builds with --all-features, which turns on cuda/vulkan and
# requires a CUDA Toolkit the release runner doesn't have.
semver_check = false

[[package]]
name = "cryon-providers"
release = true
version_group = "gdk"
# Same as cryon-local-inference: --all-features pulls in the cuda/vulkan
# accelerator features through the optional local-inference dependency.
semver_check = false

[[package]]
name = "cryon-agent"
release = true
version_group = "gdk"

[[package]]
name = "cryon-context-management"
release = true
version_group = "gdk"

[[package]]
name = "cryon-sdk"
release = true
version_group = "gdk"
